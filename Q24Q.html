<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Average Grade Calculator</title>
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  
</head>
<body style=" background-image: url(https://static.wixstatic.com/media/c68731_344f7f4ba85c4526a9ddee41a9cb9ea6~mv2.jpg/v1/fill/w_720,h_406,fp_0.50_0.50,q_80,enc_auto/c68731_344f7f4ba85c4526a9ddee41a9cb9ea6~mv2.jpg)  ;">
<center><br><br>
  <h2>Grade Calculator</h2>
  <p>Enter your grades for the subjects below:</p>

  <label>Filipino: <input type="number" id="fili"></label><br><br>
  <label>English: <input type="number" id="eng"></label><br><br>
  <label>Science: <input type="number" id="sci"></label><br><br>
   <button class="btn btn-primary" onclick="Average()">Find my Average now</button>
<script type="text/javascript">

    function Average() {
    let f = Number(document.getElementById("fili").value);
    let e = Number(document.getElementById("eng").value);
    let S = Number(document.getElementById("sci").value);

    let a = Math.round((f + e + S) / 3);
    let rating = "";

    switch (true) {
        case (a >= 94 && a <= 100):
            rating = "Excellent";
            break;
        case (a >= 87 && a < 94):
            rating = "Above Satisfactory";
            break;
        case (a >= 80 && a < 87):
            rating = "Satisfactory";
            break;
        case (a >= 75 && a < 80):
            rating = "Needs Improvement";
            break;
        case (a >= 70 && a < 75):
            rating = "Poor";
            break;
        default:
            rating = "Failing Grade";
            break;
    }

    window.alert("Your Average is " + a + " (" + rating + ")");
}

 
  </script>
</body> 
</html>
